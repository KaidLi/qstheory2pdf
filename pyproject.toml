[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "qiushi2pdf"
version = "0.1.0"
description = "将《求是》文章转化为PDF文件"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
authors = [
    {name = "StableGenius", email = "feng@dongfa.pro"},
]
keywords = ["qiushi", "qstheory", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "requests",
    "qrcode",
    "lxml",
    "pillow>=10.4.0",
]

[project.urls]
Repository = "https://github.com/fengdongfa1995/qiushi2pdf"
Issues = "https://github.com/fengdongfa1995/qiushi2pdf/issues"

[project.scripts]
qiushi2pdf = "qiushi2pdf.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
qiushi2pdf = ["resource/*.*"]
