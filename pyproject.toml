[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "qstheory2pdf"
version = "0.2.0"
description = "将《求是》文章转化为 PDF 或 EPUB 文件"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "StableGenius", email = "feng@dongfa.pro"},
]
keywords = ["qiushi", "qstheory", "pdf", "epub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "requests",
    "qrcode",
    "lxml",
    "pillow>=10.4.0",
    "ebooklib>=0.19,<1",
]

[project.urls]
Repository = "https://github.com/KaidLi/qstheory2pdf"
Issues = "https://github.com/KaidLi/qstheory2pdf/issues"

[project.scripts]
qstheory2pdf = "qstheory2pdf.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
qstheory2pdf = ["resource/*.*"]
