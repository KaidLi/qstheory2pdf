name: Build and Release PDF

on:
  schedule:
    # 每月 1 日和 16 日 UTC 18:37（北京时间次日 02:37）
    # 37 分错峰，避免整点抢占
    - cron: '37 18 1,16 * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'TOC URL（留空则自动发现最新期）'
        required: false
      device:
        description: '阅读设备预设'
        required: false
        type: choice
        default: 'normal'
        options:
          - normal
          - pad
          - kindle
          - screen
          - pc
          - scribe

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-lang-chinese

      - name: Switch fontset for Linux
        run: sed -i 's/fontset=windows/fontset=fandol/' src/qstheory2pdf/resource/qiushi.cls

      - name: Sync dependencies
        run: uv sync

      - name: Smoke test
        run: uv run python -c "import qstheory2pdf; print('qstheory2pdf', qstheory2pdf.__version__)"

      - name: Discover latest issue
        id: discover
        env:
          # Pass through env (not inline interpolation) to avoid shell injection
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          uv run python scripts/discover_issue.py "$INPUT_URL" > issue.json
          cat issue.json
          {
            echo "url=$(jq -r .url issue.json)"
            echo "volume=$(jq -r .volume issue.json)"
            echo "tag=$(jq -r .tag issue.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.discover.outputs.tag }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.discover.outputs.tag }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PDF
        if: steps.check.outputs.exists == 'false'
        run: |
          uv run qstheory2pdf \
            -d "${{ inputs.device || 'normal' }}" \
            "${{ steps.discover.outputs.url }}"

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.discover.outputs.tag }}
          name: 求是 ${{ steps.discover.outputs.volume }}
          files: output/*.pdf
          body: |
            | | |
            |---|---|
            | **期号** | ${{ steps.discover.outputs.volume }} |
            | **来源** | ${{ steps.discover.outputs.url }} |
            | **设备** | ${{ inputs.device || 'normal' }} |

            由 [qstheory2pdf](https://github.com/${{ github.repository }}) 自动生成。

      - name: Upload PDF artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.discover.outputs.tag }}
          path: output/*.pdf
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.discover.outputs.tag }}
          path: |
            output/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
