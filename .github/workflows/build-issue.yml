name: Build and Release PDF

on:
  schedule:
    # 每月 1 日和 16 日 UTC 18:37（北京时间次日 02:37）
    # 37 分错峰，避免整点抢占
    - cron: '37 18 1,16 * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'TOC URL（留空则自动发现最新期）'
        required: false
      device:
        description: '阅读设备预设（both = normal + scribe）'
        required: false
        type: choice
        default: 'both'
        options:
          - both
          - normal
          - scribe
          - pad
          - kindle
          - screen
          - pc
      font:
        description: '字体方案（auto = 开源字体自动探测；wenkai = 全文霞鹜文楷）'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - wenkai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # fonts-noto-cjk: 中文主字体（生僻字全覆盖，修复 祎/頔/赟 等缺字）
      # fonts-lxgw-wenkai: 楷体（作者/图注/引文），同样全覆盖
      # qiushi.cls 会自动检测并使用这些字体，无需再 sed 切换 fontset
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-lxgw-wenkai

      - name: Sync dependencies
        run: uv sync

      - name: Smoke test
        run: uv run python -c "import qstheory2pdf; print('qstheory2pdf', qstheory2pdf.__version__)"

      - name: Discover latest issue
        id: discover
        env:
          # Pass through env (not inline interpolation) to avoid shell injection
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          uv run python scripts/discover_issue.py "$INPUT_URL" > issue.json
          cat issue.json
          {
            echo "url=$(jq -r .url issue.json)"
            echo "volume=$(jq -r .volume issue.json)"
            echo "tag=$(jq -r .tag issue.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.discover.outputs.tag }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.discover.outputs.tag }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PDF
        if: steps.check.outputs.exists == 'false'
        env:
          DEVICE: ${{ inputs.device || 'both' }}
          FONT: ${{ inputs.font || 'auto' }}
          URL: ${{ steps.discover.outputs.url }}
          TAG: ${{ steps.discover.outputs.tag }}
        run: |
          # GitHub strips non-ASCII chars from release asset names
          # (求是_2026_14.pdf → _2026_14.pdf), so name files after the
          # ASCII release tag. normal gets the bare tag; other devices
          # get a -<device> suffix.
          build() {
            local dev="$1" suffix=""
            [ "$dev" != "normal" ] && suffix="-$dev"
            uv run qstheory2pdf -d "$dev" -f "$FONT" -o "output/${TAG}${suffix}.pdf" "$URL"
          }
          if [ "$DEVICE" = "both" ]; then
            build normal
            build scribe
          else
            build "$DEVICE"
          fi

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.discover.outputs.tag }}
          name: 求是 ${{ steps.discover.outputs.volume }}
          files: output/*.pdf
          body: |
            | | |
            |---|---|
            | **期号** | ${{ steps.discover.outputs.volume }} |
            | **来源** | ${{ steps.discover.outputs.url }} |
            | **设备** | ${{ inputs.device || 'both' }}（both = normal + scribe） |

            由 [qstheory2pdf](https://github.com/${{ github.repository }}) 自动生成。

      - name: Upload PDF artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.discover.outputs.tag }}
          path: output/*.pdf
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.discover.outputs.tag }}
          path: |
            output/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
