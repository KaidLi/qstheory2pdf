name: Build and Release Publications

on:
  schedule:
    # 每月 1 日和 16 日 UTC 18:37（北京时间次日 02:37）
    # 37 分错峰，避免整点抢占
    - cron: '37 18 1,16 * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'TOC URL（留空则自动发现最新期）'
        required: false
      device:
        description: '阅读设备预设（both = normal + scribe）'
        required: false
        type: choice
        default: 'both'
        options:
          - both
          - normal
          - scribe
          - pad
          - kindle
          - screen
          - pc
      font:
        description: '字体方案（auto = 开源字体自动探测；wenkai = 全文霞鹜文楷）'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - wenkai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # fonts-noto-cjk: 中文主字体（生僻字全覆盖，修复 祎/頔/赟 等缺字）
      # fonts-lxgw-wenkai: 楷体（作者/图注/引文），同样全覆盖
      # qiushi.cls 会自动检测并使用这些字体，无需再 sed 切换 fontset
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-lxgw-wenkai

      - name: Sync dependencies
        run: uv sync

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Smoke test
        run: |
          uv run python -m compileall -q src scripts tests
          uv run python -m unittest discover -s tests -v
          uv run python -c "import qstheory2pdf; print('qstheory2pdf', qstheory2pdf.__version__)"

      - name: Discover latest issue
        id: discover
        env:
          # Pass through env (not inline interpolation) to avoid shell injection
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          uv run python scripts/discover_issue.py "$INPUT_URL" > issue.json
          cat issue.json
          {
            echo "url=$(jq -r .url issue.json)"
            echo "volume=$(jq -r .volume issue.json)"
            echo "tag=$(jq -r .tag issue.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.discover.outputs.tag }}
        run: |
          if ! gh release view "$TAG" &>/dev/null; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -Fxq "${TAG}.epub"; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Release $TAG 已包含 EPUB，跳过构建"
          else
            echo "mode=epub-only" >> "$GITHUB_OUTPUT"
            echo "Release $TAG 缺少 EPUB，将补齐附件"
          fi

      - name: Build publications
        if: steps.check.outputs.mode != 'skip'
        env:
          DEVICE: ${{ inputs.device || 'both' }}
          FONT: ${{ inputs.font || 'auto' }}
          URL: ${{ steps.discover.outputs.url }}
          TAG: ${{ steps.discover.outputs.tag }}
        run: |
          build_pdf() {
            local dev="$1" suffix=""
            [ "$dev" != "normal" ] && suffix="-$dev"
            uv run qstheory2pdf \
              --status-file "output/reconstruction-${dev}.json" \
              -d "$dev" -f "$FONT" -o "output/${TAG}${suffix}.pdf" "$URL"
          }
          if [ "${{ steps.check.outputs.mode }}" = "epub-only" ]; then
            uv run qstheory2pdf \
              --status-file output/reconstruction-epub.json \
              --format epub -o "output/${TAG}.epub" "$URL"
          elif [ "$DEVICE" = "both" ]; then
            uv run qstheory2pdf \
              --status-file output/reconstruction-normal.json \
              --format both -d normal -f "$FONT" -o "output/${TAG}" "$URL"
            build_pdf scribe
          else
            uv run qstheory2pdf \
              --status-file "output/reconstruction-${DEVICE}.json" \
              --format both -d "$DEVICE" -f "$FONT" -o "output/${TAG}" "$URL"
          fi

      - name: Validate reconstruction completeness
        if: steps.check.outputs.mode != 'skip'
        run: |
          shopt -s nullglob
          statuses=(output/reconstruction-*.json)
          [ "${#statuses[@]}" -gt 0 ] || { echo "缺少重建状态文件"; exit 1; }
          for status in "${statuses[@]}"; do
            jq -e '.state == "complete"' "$status"
          done

      - name: Validate EPUB
        if: steps.check.outputs.mode != 'skip'
        env:
          EPUBCHECK_VERSION: '5.3.0'
        run: |
          curl -sSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q /tmp/epubcheck.zip -d /tmp
          for book in output/*.epub; do
            java -jar "/tmp/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "$book"
          done

      - name: Create Release
        if: steps.check.outputs.mode != 'skip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.discover.outputs.tag }}
          name: 求是 ${{ steps.discover.outputs.volume }}
          files: |
            output/*.pdf
            output/*.epub
          body: |
            | | |
            |---|---|
            | **期号** | ${{ steps.discover.outputs.volume }} |
            | **来源** | ${{ steps.discover.outputs.url }} |
            | **设备** | ${{ inputs.device || 'both' }}（both = normal + scribe） |
            | **格式** | PDF + EPUB（EPUB 为墨水屏可重排版） |

            由 [qstheory2pdf](https://github.com/${{ github.repository }}) 自动生成。

      - name: Upload publication artifacts
        if: steps.check.outputs.mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.discover.outputs.tag }}
          path: |
            output/*.pdf
            output/*.epub
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ steps.discover.outputs.tag }}
          path: |
            output/
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
